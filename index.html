<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-box">
        <h1>BINGO GAME</h1>
        <p class ="subtitle">Welcome Player!</p>

        <input type="text" id="username" placeholder="Enter your name">

        <br><br>

        <button type="button"
         onclick="savePlayer()">
         Login</button>

        <h2 id="welcome"></h2>

    </div>

<script src="login.js"></script>
<p class="footer">
Created by Rosmi Theresa Mathew
</p>
<script>
function savePlayer() {

    let name =
    document.getElementById("username").value;

    localStorage.setItem("player", name);

    window.location.href = "bingo.html";
}
</script>

</body>

</html>
